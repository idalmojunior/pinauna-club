<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking ao vivo — Pinaúna 4ª Edição</title>
<style>
  :root{ --laranja:#ff5e1a; --roxo:#5b2a9e; --rosa:#b0299e; --tinta:#1b0f2e; --amarelo:#d7ea3c; }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Segoe UI',Arial,sans-serif;color:#fff;min-height:100vh;
    background:linear-gradient(160deg, var(--laranja) 0%, var(--rosa) 55%, var(--roxo) 100%);
  }
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
  h1{text-align:center;margin:0 0 2px;text-transform:uppercase;letter-spacing:1px;font-size:1.6rem;}
  .sub{text-align:center;opacity:.85;margin:0 0 20px;font-size:.9rem;}

  .abas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;}
  .abas button{
    padding:10px 18px;border-radius:30px;border:2px solid rgba(255,255,255,.4);background:transparent;
    color:#fff;font-weight:700;cursor:pointer;font-size:.9rem;
  }
  .abas button.ativa{background:var(--amarelo);color:var(--tinta);border-color:var(--amarelo);}

  .categoria-bloco{background:rgba(0,0,0,.28);border-radius:18px;padding:18px 20px;margin-bottom:18px;}
  .categoria-bloco h2{margin:0 0 12px;font-size:1.05rem;text-transform:uppercase;letter-spacing:.5px;color:var(--amarelo);}
  table{width:100%;border-collapse:collapse;}
  td{padding:8px 4px;font-size:.95rem;border-bottom:1px solid rgba(255,255,255,.12);}
  td.pos{font-weight:800;width:44px;}
  td.pos.ouro{color:#ffd54a;}
  td.pos.prata{color:#d8d8d8;}
  td.pos.bronze{color:#e0955a;}
  .vazio{text-align:center;opacity:.7;padding:30px 0;}
  .atualizado{text-align:center;font-size:.75rem;opacity:.6;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ranking ao vivo</h1>
  <p class="sub">Pinaúna Club — 4ª Edição — Troféu Ana Serra</p>

  <div class="abas" id="abas">
    <button data-prova="2KM" class="ativa">2km</button>
    <button data-prova="500M">500m</button>
    <button data-prova="200M">200m</button>
    <button data-prova="AQUATHLON">Aquathlon</button>
  </div>

  <div id="conteudo"><p class="vazio">Carregando...</p></div>
  <p class="atualizado" id="atualizado"></p>
</div>

<script>
let provaAtual = "2KM";

document.querySelectorAll('#abas button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#abas button').forEach(b => b.classList.remove('ativa'));
    btn.classList.add('ativa');
    provaAtual = btn.dataset.prova;
    carregar();
  });
});

function medalha(pos){
  if (pos === 1) return 'ouro';
  if (pos === 2) return 'prata';
  if (pos === 3) return 'bronze';
  return '';
}

async function carregar(){
  try {
    const resp = await fetch(`/api/evento-ranking?prova=${encodeURIComponent(provaAtual)}`);
    const json = await resp.json();
    const el = document.getElementById('conteudo');

    if (!resp.ok || !json.ok) {
      el.innerHTML = '<p class="vazio">Ainda não há resultados para essa prova.</p>';
      return;
    }

    const categorias = Object.keys(json.categorias || {});
    if (!categorias.length) {
      el.innerHTML = '<p class="vazio">Ainda não há resultados para essa prova.</p>';
    } else {
      el.innerHTML = categorias.map(cat => `
        <div class="categoria-bloco">
          <h2>${cat}</h2>
          <table>
            ${json.categorias[cat].map(r => `
              <tr>
                <td class="pos ${medalha(r.posicao_categoria)}">${r.posicao_categoria}º</td>
                <td>${r.numero ? `<b>${r.numero}</b> — ` : ''}${r.nome}</td>
              </tr>
            `).join('')}
          </table>
        </div>
      `).join('');
    }

    document.getElementById('atualizado').textContent =
      'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
  } catch (err) {
    document.getElementById('conteudo').innerHTML = '<p class="vazio">Erro ao carregar o ranking.</p>';
  }
}

carregar();
setInterval(carregar, 5000);
</script>
</body>
</html>
